name: skip immutable release tags with an action commit map

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Immutable release, mapped
      uses: test-org/locked@5555555555555555555555555555555555555555 # v1.2.3
    - name: Immutable release, sub-path action, not mapped
      uses: test-org/locked/sub/path@v1.2.3
    - name: Mutable release, mapped
      uses: test-org/mutable@6666666666666666666666666666666666666666 # v2.0.0
