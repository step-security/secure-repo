name: Publish

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      TURBO_TELEMETRY_DISABLED: 1
      HUSKY: 0

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEPSECURITY_POLICY_STORE_API_KEY }}

      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install and build
        uses: ./.github/workflows/install-and-build

      - name: Publish to npm
        run: |
          OUTPUT=$(pnpm --filter="@paddle/checkout-component-library" publish --access restricted --no-git-checks --report-summary 2>&1) && echo "$OUTPUT" || {
            if echo "$OUTPUT" | grep -q "You cannot publish over the previously published versions"; then
              echo "Version already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
