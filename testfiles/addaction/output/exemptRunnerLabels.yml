name: test-exempt-runner-labels
on:
  push:
jobs:
  gpu-build:
    runs-on: gpu-large
    steps:
      - uses: actions/checkout@v3
      - run: echo "gpu build"

  standard-build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v3
      - run: echo "standard build"
