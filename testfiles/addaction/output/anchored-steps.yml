name: ci
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps: &build_steps
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: make build
  build-reproducible:
    runs-on: ubuntu-latest
    steps: *build_steps
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Test
        run: make test
