name: test-custom-multi-job
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v3

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: acme-corp/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v3

  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
