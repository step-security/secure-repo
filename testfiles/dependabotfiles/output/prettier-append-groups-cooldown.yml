version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    cooldown:
      default-days: 5
      include:
        - "*"
