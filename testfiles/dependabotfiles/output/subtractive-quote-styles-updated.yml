version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/app"
      - /tools
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "some-org*/*"
      - dependency-name: new-org/pkg
  - package-ecosystem: pip
    directory: '/services'
    schedule:
      interval: 'weekly'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["actions/*", docker/*]
