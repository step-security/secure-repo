version: 2
# Monorepo dependabot configuration
# managed by step-security

registries:
  npm-private:
    type: npm-registry
    url: https://registry.npmjs.org
    token: ${{ secrets.NPM_TOKEN }}

updates:
  # npm packages - covers root and all sub-packages
  - package-ecosystem: npm
    directories:
      - /
      - /packages/ember-native-links
      - /packages/test-app
    schedule:
      interval: weekly
    cooldown:
      default-days: 5

  # docker images used in CI
  - package-ecosystem: docker
    directories:
      - /a
      - /b
      - /c
    schedule:
      interval: daily
    groups:
      all:
        patterns:
          - '*'
