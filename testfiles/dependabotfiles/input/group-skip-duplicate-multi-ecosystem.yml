version: 2

registries:
  npm-artifactory:
    type: npm-registry
    url: https://artifactory.example.com/api/npm/npm-remote/
    token: ${{ secrets.ARTIFACTORY_TOKEN }}

updates:
  # Node.js dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    registries:
      - npm-artifactory
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      # Customer already groups all production deps
      prod-updates:
        patterns:
          - "*"
        dependency-type: production
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Python dependencies
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
    groups:
      # Customer groups Django-related packages
      django:
        patterns:
          - django
          - djangorestframework
          - django-cors-headers
        dependency-type: production
    cooldown:
      default-days: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
